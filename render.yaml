services:
  - type: web_service
    name: locationdevoitures-backend
    env: node
    root: backend
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: OPENWEATHER_API_KEY
      - key: DATABASE_PATH
        value: backend/db/locationdevoitures.sqlite
      - key: FRONTEND_ORIGIN
        value: https://your-frontend-service.onrender.com

staticSites:
  - type: static_site
    name: locationdevoitures-frontend
    root: .
    buildCommand: npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://your-backend-service.onrender.com/api
