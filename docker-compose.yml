version: '3.9'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:4000/api
    ports:
      - '4173:80'
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - DATABASE_PATH=backend/db/locationdevoitures.sqlite
      - TYPEORM_SYNC=true
      - TYPEORM_LOGGING=false
      - REDIS_URL=${REDIS_URL}
      - PORT=4000
    volumes:
      - ./backend/db:/app/backend/db
